env:
  name: "LunarLander-v3"
  seed: 42
  render_mode: "rgb_array"
  continuous: true

train:
  n_episodes: 800
  max_steps: 1000
  save_path: "bonus/models/td3.pt"

algo:
  name: "td3"
  gamma: 0.99
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  batch_size: 256
  buffer_size: 1000000
  tau: 0.005
  exploration_noise: 0.1
  target_noise: 0.2
  target_noise_clip: 0.5
  policy_delay: 2
  start_steps: 10000
  learn_every: 1
