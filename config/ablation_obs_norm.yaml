env:
  name: "LunarLander-v3"
  seed: 42
  render_mode: "rgb_array"

train:
  n_episodes: 600
  max_steps: 1000
  save_path: "models/dqn_ablation_obs_norm.pt"

algo:
  name: "dqn"
  gamma: 0.99
  lr: 1.0e-3
  batch_size: 64
  buffer_size: 100000
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.995
  target_update_freq: 1000
  soft_update: false
  obs_norm: true